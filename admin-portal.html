<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Brain Control Lab v4.2 · SA Invoice Pro</title>
<style>
:root{--bg:#0c0a14;--card:#16122a;--line:#2a2448;--text:#f0e6ff;--muted:#a89bc8;--accent:#e879f9;--ok:#34d399;--danger:#f87171;--blue:#38bdf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.45rem;margin:0 0 4px;background:linear-gradient(90deg,#e879f9,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 8px 32px rgba(0,0,0,.35)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f0b1e;color:var(--text);margin:6px 0;font:inherit}
button,.btn{padding:9px 14px;border-radius:10px;border:0;background:linear-gradient(135deg,#e879f9,#a855f7);color:#1a0a20;font-weight:700;cursor:pointer;margin:3px;font:inherit}
.btn{display:inline-block;text-decoration:none}
.btn-ok{background:linear-gradient(135deg,#34d399,#059669);color:#042f2e}
.btn-danger,.btn-danger{background:#f87171;color:#1a0a20}
.btn-outline,button.secondary{background:#2a2448;color:var(--text)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tab{background:#0f0b1e;border:1px solid var(--line);color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer;transition:all .15s}
.tab.on{color:#fff;border-color:var(--accent);background:linear-gradient(135deg,#2e1065,#4a044e)}
.hidden{display:none}.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#2a2448;font-size:.72rem}.pill.ok{background:#065f46;color:#a7f3d0}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:#0f0b1e;border:1px solid var(--line);border-radius:12px;padding:14px}.stat .l{font-size:.72rem;color:var(--muted);text-transform:uppercase}.stat .v{font-size:1.25rem;font-weight:700;margin-top:4px}
#toast{position:fixed;bottom:16px;right:16px;background:#221a3a;border:1px solid var(--line);padding:12px 16px;border-radius:12px;display:none;z-index:99;max-width:320px}
.brand{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
a{color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <div id="login" class="card">
    <div class="brand">PC REPAIR DEX · SAIP</div>
    <h1>Enter the Lab</h1>
    <p class="sub">Brain Control Lab — admin portal for WhatsApp, tickets, invoices & outbox</p>
    <input id="email" type="email" placeholder="Email" value="admin@sainvoice.pro" autocomplete="username"/>
    <input id="password" type="password" placeholder="Password" autocomplete="current-password"/>
    <div class="row" style="margin-top:10px">
      <button type="button" id="btn-login">Enter the Lab</button>
    </div>
    <p id="login-err" class="sub" style="color:var(--danger)"></p>
  </div>

  <div id="app" class="hidden">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <div class="brand">World Domination Mega Pack</div>
        <h1>Brain Control Lab</h1>
        <p class="sub" id="who"></p>
      </div>
      <button type="button" class="btn-outline" id="btn-logout">Logout</button>
    </div>

    <div class="tabs">
      <button type="button" class="tab on" data-tab="dash">Dashboard</button>
      <button type="button" class="tab" data-tab="wa">WA Clients</button>
      <button type="button" class="tab" data-tab="tickets">Tickets</button>
      <button type="button" class="tab" data-tab="invoices">Invoices</button>
      <button type="button" class="tab" data-tab="outbox">Outbox</button>
      <button type="button" class="tab" data-tab="users">Users</button>
      <button type="button" class="tab" data-tab="notifs">Notifications</button>
      <button type="button" class="tab" data-tab="tools">Tools</button>
    </div>

    <div id="panel-dash" class="card"></div>
    <div id="panel-wa" class="card hidden"></div>
    <div id="panel-tickets" class="card hidden"></div>
    <div id="panel-invoices" class="card hidden"></div>
    <div id="panel-outbox" class="card hidden"></div>
    <div id="panel-users" class="card hidden"></div>
    <div id="panel-notifs" class="card hidden"></div>
    <div id="panel-tools" class="card hidden"></div>
  </div>
</div>
<div id="toast"></div>
<script>
(function () {
  var token = localStorage.getItem("saip_admin_token") || "";

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(function () { el.style.display = "none"; }, 4000);
  }
  function showLoginError(msg) {
    document.getElementById("login-err").textContent = msg || "";
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function api(path, opts) {
    opts = opts || {};
    var h = { "Content-Type": "application/json" };
    if (token) h.Authorization = "Bearer " + token;
    return fetch(path, {
      method: opts.method || "GET",
      headers: h,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(data.error || r.statusText || "Request failed");
        return data;
      });
    });
  }

  function showApp() {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    refreshAll();
  }

  function login() {
    showLoginError("");
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    api("/api/auth/login", { method: "POST", body: { email: email, password: password } })
      .then(function (d) {
        token = d.token;
        localStorage.setItem("saip_admin_token", token);
        document.getElementById("who").textContent = (d.user && d.user.email) || email;
        showApp();
      })
      .catch(function (e) { showLoginError(e.message); });
  }

  document.getElementById("btn-login").onclick = login;
  document.getElementById("password").addEventListener("keydown", function (e) {
    if (e.key === "Enter") login();
  });
  document.getElementById("btn-logout").onclick = function () {
    token = "";
    localStorage.removeItem("saip_admin_token");
    location.reload();
  };

  document.querySelectorAll("[data-tab]").forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll("[data-tab]").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      var tab = b.getAttribute("data-tab");
      ["dash", "wa", "tickets", "invoices", "outbox", "users", "notifs", "tools"].forEach(function (n) {
        document.getElementById("panel-" + n).classList.toggle("hidden", n !== tab);
      });
      if (tab === "wa") loadWa().catch(function (e) { toast(e.message); });
      if (tab === "tickets") loadTickets().catch(function (e) { toast(e.message); });
      if (tab === "invoices") loadInvoices().catch(function (e) { toast(e.message); });
      if (tab === "outbox") loadOutbox().catch(function (e) { toast(e.message); });
      if (tab === "users") loadUsers().catch(function (e) { toast(e.message); });
      if (tab === "notifs") loadNotifs().catch(function (e) { toast(e.message); });
      if (tab === "tools") loadTools();
      if (tab === "dash") loadDash().catch(function (e) { toast(e.message); });
    };
  });

  function loadDash() {
    return api("/api/admin/stats").then(function (d) {
      var s = d.stats || {};
      document.getElementById("panel-dash").innerHTML =
        '<div class="row" style="justify-content:space-between"><h3 style="margin:0">Dashboard</h3>'
        + '<button type="button" class="btn-outline" data-act="refresh-dash">Refresh</button></div>'
        + '<div class="stat-grid">'
        + '<div class="stat"><div class="l">Users</div><div class="v">' + (s.users || 0) + '</div></div>'
        + '<div class="stat"><div class="l">WA clients</div><div class="v">' + (s.wa_clients || 0) + '</div></div>'
        + '<div class="stat"><div class="l">Registered</div><div class="v">' + (s.wa_registered || 0) + '</div></div>'
        + '<div class="stat"><div class="l">Pending import</div><div class="v">' + (s.wa_pending_import || 0) + '</div></div>'
        + '<div class="stat"><div class="l">Tickets open</div><div class="v">' + (s.tickets_open || 0) + '</div></div>'
        + '<div class="stat"><div class="l">Tickets total</div><div class="v">' + (s.tickets_total || 0) + '</div></div>'
        + '<div class="stat"><div class="l">Outstanding AR</div><div class="v">R' + Number(s.outstanding_ar || 0).toFixed(2) + '</div></div>'
        + '<div class="stat"><div class="l">Outbox pending</div><div class="v">' + (s.outbox_pending || 0) + '</div></div>'
        + '</div>'
        + '<p class="sub">Generated ' + esc(d.generated_at || '') + ' · Forms: <a href="/forms/register" target="_blank">Register</a> · <a href="/forms/job" target="_blank">Job</a></p>';
    });
  }

  function loadWa() {
    return api("/api/admin/wa-clients").then(function (d) {
      var rows = (d.clients || []).map(function (c) {
        var phone = esc(c.phone);
        return "<tr>"
          + "<td><div>" + esc(c.name || "—") + '</div><div style="color:var(--muted);font-size:.75rem">' + phone + "</div></td>"
          + "<td>" + esc(c.email || "—") + "</td>"
          + "<td>" + (c.registered ? '<span class="pill ok">yes</span>' : '<span class="pill">no</span>') + (c.pending_import ? ' <span class="pill">pending</span>' : "") + "</td>"
          + "<td>" + esc(c.source || "") + "</td>"
          + '<td class="row" style="flex-wrap:wrap">'
          + (c.registered ? "" : '<button type="button" class="btn-ok" data-act="force-wa" data-phone="' + phone + '">Mark reg</button>')
          + '<button type="button" class="btn" data-act="queue-msg" data-phone="' + phone + '">Message</button>'
          + '<button type="button" class="btn-danger" data-act="delwa" data-phone="' + phone + '">Remove</button></td></tr>';
      }).join("");
      document.getElementById("panel-wa").innerHTML =
        '<h3 style="margin:0 0 12px">WhatsApp clients (' + (d.count || 0) + ')</h3>'
        + '<p class="sub">Mark reg stops “not registered” on AutoResponder. Message queues WhatsApp outbox text.</p>'
        + "<table><thead><tr><th>Client</th><th>Email</th><th>Reg</th><th>Source</th><th>Actions</th></tr></thead><tbody>"
        + (rows || '<tr><td colspan="5">None yet — customers register via WhatsApp or /forms/register</td></tr>')
        + "</tbody></table>";
    });
  }

  function loadTickets() {
    return api("/api/admin/tickets").then(function (d) {
      var rows = (d.tickets || []).map(function (t) {
        var id = esc(t.id);
        return "<tr>"
          + "<td>" + esc(t.customer_name || "—") + '<div style="color:var(--muted);font-size:.75rem">' + esc(t.customer_phone || "") + "</div></td>"
          + "<td>" + esc(t.device || "—") + "</td>"
          + "<td>" + esc(t.issue || "—") + "</td>"
          + "<td>" + esc((t.urgency || "") + " / " + (t.status || "new")) + "</td>"
          + '<td class="row">'
          + '<button type="button" class="btn-ok" data-act="ticket" data-id="' + id + '" data-status="in_progress">Start</button>'
          + '<button type="button" class="btn" data-act="ticket" data-id="' + id + '" data-status="resolved">Resolve</button>'
          + '<button type="button" class="btn-outline" data-act="ticket" data-id="' + id + '" data-status="closed">Close</button>'
          + '<button type="button" class="btn-danger" data-act="delticket" data-id="' + id + '">Del</button></td></tr>';
      }).join("");
      document.getElementById("panel-tickets").innerHTML =
        '<h3 style="margin:0 0 12px">Intake tickets (' + (d.count || 0) + ')</h3>'
        + "<table><thead><tr><th>Customer</th><th>Device</th><th>Issue</th><th>Urgency / Status</th><th>Actions</th></tr></thead><tbody>"
        + (rows || '<tr><td colspan="5">No intake tickets</td></tr>')
        + "</tbody></table>";
    });
  }

  function loadInvoices() {
    return api("/api/admin/invoices").then(function (d) {
      var rows = (d.invoices || []).map(function (i) {
        return "<tr><td>" + esc(i.invoice_number) + "</td><td>" + esc(i.client_name || "—") + "</td><td>" + esc(i.client_phone || "") + "</td><td>R" + Number(i.balance_due ?? i.total || 0).toFixed(2) + "</td><td>" + esc(i.status) + "</td></tr>";
      }).join("");
      document.getElementById("panel-invoices").innerHTML =
        '<div class="row" style="justify-content:space-between"><h3 style="margin:0">Invoice status index</h3><button type="button" class="btn-outline" data-act="refresh-inv">Refresh</button></div>'
        + "<table><thead><tr><th>Number</th><th>Client</th><th>Phone</th><th>Balance</th><th>Status</th></tr></thead><tbody>"
        + (rows || '<tr><td colspan="5">None synced yet</td></tr>')
        + "</tbody></table>";
    });
  }

  function loadOutbox() {
    return api("/api/admin/outbox").then(function (d) {
      var rows = (d.messages || []).map(function (m) {
        return "<tr><td>" + esc(m.phone) + "</td><td style=\"max-width:280px;white-space:pre-wrap;font-size:.8rem\">" + esc((m.message || "").slice(0, 180)) + "</td><td>" + (m.delivered ? "sent" : "pending") + "</td><td>" + (m.delivered ? "" : '<button type="button" class="btn-outline" data-act="ack-outbox" data-id="' + esc(m.id) + '">Ack</button>') + "</td></tr>";
      }).join("");
      document.getElementById("panel-outbox").innerHTML =
        '<h3 style="margin:0 0 12px">WhatsApp outbox (' + (d.pending || 0) + " pending)</h3>"
        + '<div class="card" style="background:#0f0b1e"><label class="sub">Queue a message</label>'
        + '<div class="row"><input id="ob-phone" placeholder="2782…" style="flex:1"/><textarea id="ob-msg" rows="2" placeholder="Message text" style="flex:2"></textarea>'
        + '<button type="button" class="btn" data-act="queue-outbox">Queue</button>'
        + '<button type="button" class="btn-outline" data-act="ack-all-outbox">Ack all</button>'
        + '<button type="button" class="btn-outline" data-act="refresh-outbox">Refresh</button></div></div>'
        + "<table><thead><tr><th>Phone</th><th>Message</th><th>Status</th><th></th></tr></thead><tbody>"
        + (rows || '<tr><td colspan="4">Empty</td></tr>')
        + "</tbody></table>";
    });
  }

  function loadUsers() {
    return api("/api/admin/users").then(function (d) {
      var rows = (d.users || []).map(function (u) {
        return "<tr><td>" + esc(u.email) + "</td><td>" + esc(u.role) + "</td><td>" + esc((u.created_at || "").slice(0, 10)) + "</td>"
          + '<td class="row"><button type="button" class="btn-outline" data-act="reset" data-id="' + esc(u.id) + '">Reset pw</button>'
          + '<button type="button" class="btn-danger" data-act="deluser" data-id="' + esc(u.id) + '" data-email="' + esc(u.email) + '">Delete</button></td></tr>';
      }).join("");
      document.getElementById("panel-users").innerHTML =
        '<div class="row" style="justify-content:space-between"><h3 style="margin:0">Users</h3><button type="button" class="btn-outline" data-act="refresh-users">Refresh</button></div>'
        + "<table><thead><tr><th>Email</th><th>Role</th><th>Created</th><th>Actions</th></tr></thead><tbody>"
        + (rows || "") + "</tbody></table>";
    });
  }

  function loadNotifs() {
    return api("/api/admin/notifications").then(function (d) {
      var rows = (d.notifications || []).map(function (n) {
        return "<tr><td>" + esc(n.title) + "</td><td>" + esc(n.body) + "</td><td>" + esc((n.created_at || "").slice(0, 19)) + "</td></tr>";
      }).join("");
      document.getElementById("panel-notifs").innerHTML =
        '<div class="row" style="justify-content:space-between"><h3 style="margin:0">Notifications</h3>'
        + '<button type="button" class="btn-danger" data-act="clear-notifs">Clear all</button></div>'
        + "<table><thead><tr><th>Title</th><th>Body</th><th>When</th></tr></thead><tbody>"
        + (rows || '<tr><td colspan="3">None</td></tr>') + "</tbody></table>";
    });
  }

  function loadTools() {
    document.getElementById("panel-tools").innerHTML =
      '<h3 style="margin:0 0 12px">Tools</h3>'
      + '<div class="card" style="background:#0f0b1e">'
      + '<label class="sub">Lookup WhatsApp number</label>'
      + '<div class="row"><input id="tool-phone" placeholder="0821234567 or 2782…" style="flex:1"/>'
      + '<button type="button" class="btn" data-act="lookup">Lookup</button></div>'
      + '<pre id="tool-result" style="margin-top:12px;font-size:.8rem;white-space:pre-wrap;color:var(--muted)">Enter a number to see registration + tickets.</pre></div>'
      + '<div class="card" style="background:#0f0b1e;margin-top:12px">'
      + '<label class="sub">Force-register number (marks registered=true)</label>'
      + '<div class="row"><input id="force-phone" placeholder="Phone digits" style="flex:1"/>'
      + '<input id="force-name" placeholder="Name" style="flex:1"/>'
      + '<button type="button" class="btn-ok" data-act="force-reg">Force register</button></div></div>'
      + '<p class="sub">Forms: <a href="/forms/register" target="_blank">Register</a> · <a href="/forms/job" target="_blank">Job</a> · <a href="/health" target="_blank">Health</a> · <a href="/api/ar" target="_blank">AR brain</a></p>';
  }

  function refreshAll() {
    return loadDash().catch(function (e) { toast(e.message); });
  }

  document.body.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-act]");
    if (!btn) return;
    var act = btn.getAttribute("data-act");
    if (act === "refresh-users") {
      loadUsers().catch(function (err) { toast(err.message); });
    } else if (act === "reset") {
      if (!confirm("Generate a temporary password for this user?")) return;
      api("/api/admin/users/" + btn.getAttribute("data-id") + "/reset-password", { method: "POST", body: {} })
        .then(function (d) { prompt("Temporary password (copy now):", d.temporary_password); toast("Password reset for " + d.email); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "deluser") {
      var email = btn.getAttribute("data-email");
      if (!confirm("Delete account " + email + " and their workspace?")) return;
      api("/api/admin/users/" + btn.getAttribute("data-id"), { method: "DELETE" })
        .then(function () { toast("Deleted " + email); return loadUsers(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "delwa") {
      var phone = btn.getAttribute("data-phone");
      if (!confirm("Remove WA profile " + phone + "?")) return;
      api("/api/admin/wa-clients/" + phone, { method: "DELETE" })
        .then(function () { toast("Removed"); return loadWa(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "ticket") {
      api("/api/admin/tickets/" + btn.getAttribute("data-id"), { method: "PATCH", body: { status: btn.getAttribute("data-status") } })
        .then(function () { toast("Ticket updated"); return loadTickets(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "delticket") {
      if (!confirm("Delete this intake ticket?")) return;
      api("/api/admin/tickets/" + btn.getAttribute("data-id"), { method: "DELETE" })
        .then(function () { toast("Deleted"); return loadTickets(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "clear-notifs") {
      api("/api/admin/notifications/clear", { method: "POST", body: {} })
        .then(function () { toast("Cleared"); return loadNotifs(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "refresh-dash") {
      loadDash().catch(function (err) { toast(err.message); });
    } else if (act === "refresh-inv") {
      loadInvoices().catch(function (err) { toast(err.message); });
    } else if (act === "refresh-outbox") {
      loadOutbox().catch(function (err) { toast(err.message); });
    } else if (act === "queue-outbox") {
      var ph = (document.getElementById("ob-phone") || {}).value || "";
      var msg = (document.getElementById("ob-msg") || {}).value || "";
      api("/api/admin/outbox/queue", { method: "POST", body: { phone: ph, message: msg } })
        .then(function () { toast("Queued"); return loadOutbox(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "ack-outbox") {
      api("/api/admin/outbox/ack", { method: "POST", body: { id: btn.getAttribute("data-id") } })
        .then(function () { toast("Acked"); return loadOutbox(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "ack-all-outbox") {
      api("/api/admin/outbox/ack", { method: "POST", body: {} })
        .then(function (d) { toast("Acked " + (d.acked || 0)); return loadOutbox(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "lookup") {
      var p = (document.getElementById("tool-phone") || {}).value || "";
      api("/api/admin/lookup?phone=" + encodeURIComponent(p))
        .then(function (d) { document.getElementById("tool-result").textContent = JSON.stringify(d, null, 2); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "queue-msg") {
      var qphone = btn.getAttribute("data-phone");
      var qmsg = prompt("Message to queue for " + qphone + ":", "Hi — PC REPAIR DEX here. Reply *menu* for options.");
      if (!qmsg) return;
      api("/api/admin/outbox/queue", { method: "POST", body: { phone: qphone, message: qmsg } })
        .then(function () { toast("Queued for " + qphone); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "force-reg") {
      var fp = (document.getElementById("force-phone") || {}).value || "";
      var fn = (document.getElementById("force-name") || {}).value || "Client";
      api("/api/admin/wa-clients/" + encodeURIComponent(fp.replace(/\D/g, "")) + "/force-register", { method: "POST", body: { name: fn } })
        .then(function (d) { toast("Registered " + (d.client && d.client.phone)); return loadWa(); })
        .catch(function (err) { toast(err.message); });
    } else if (act === "force-wa") {
      var fphone = btn.getAttribute("data-phone");
      api("/api/admin/wa-clients/" + fphone + "/force-register", { method: "POST", body: {} })
        .then(function () { toast("Marked registered"); return loadWa(); })
        .catch(function (err) { toast(err.message); });
    }
  });

  if (token) {
    api("/api/admin/me").then(function (d) {
      document.getElementById("who").textContent = (d.admin && d.admin.email) || "";
      showApp();
    }).catch(function () {
      localStorage.removeItem("saip_admin_token");
      token = "";
    });
  }
})();
</script>
</body>
</html>
