<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="theme-color" content="#0b1220"/>
<title>Admin · SA Invoice Pro Sync</title>
<style>
:root, [data-theme="dark"] {
  --bg:#0b1220; --bg-elevated:#111827; --surface:#151c2c; --surface-2:#1a2336;
  --border:#243044; --text:#e8eef7; --text-secondary:#94a3b8; --muted:#64748b;
  --primary:#3b82f6; --primary-hover:#2563eb; --primary-soft:rgba(59,130,246,.14);
  --success:#10b981; --danger:#ef4444; --warning:#f59e0b;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.2);
  --input-bg:#0f172a; --nav-h:58px;
}
[data-theme="light"] {
  --bg:#f1f5f9; --surface:#fff; --surface-2:#f8fafc; --border:#e2e8f0;
  --text:#0f172a; --text-secondary:#475569; --muted:#64748b;
  --primary:#2563eb; --primary-soft:rgba(37,99,235,.1); --input-bg:#fff;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.hidden{display:none!important}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 22px}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--primary);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--input-bg);color:var(--text);font:inherit}
.app{display:none;min-height:100vh}
.app.on{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--surface)}
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px)}
@media(max-width:800px){.layout{grid-template-columns:1fr}}
.side{border-right:1px solid var(--border);padding:12px;background:var(--surface)}
.tab{display:block;width:100%;text-align:left;appearance:none;background:transparent;border:0;color:var(--text-secondary);padding:10px 12px;border-radius:8px;font:inherit;cursor:pointer;margin-bottom:4px}
.tab.on,.tab:hover{background:var(--primary-soft);color:var(--primary)}
.main{padding:16px}
.panel{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:12px}.stat .l{font-size:12px;color:var(--muted)}.stat .v{font-size:1.4rem;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99}
</style>
</head>
<body>
<div id="login" class="login-shell">
  <div class="login-card">
    <h1 style="margin:0 0 8px;font-size:1.35rem">Admin portal</h1>
    <p style="color:var(--muted);margin:0 0 16px;font-size:14px">SA Invoice Pro Sync · multi-tenant</p>
    <label style="display:block;font-size:13px;margin-bottom:4px">Email</label>
    <input id="email" class="input" type="email" autocomplete="username" value="admin@sainvoice.pro"/>
    <label style="display:block;font-size:13px;margin:12px 0 4px">Password</label>
    <input id="password" class="input" type="password" autocomplete="current-password"/>
    <p id="login-err" style="color:var(--danger);font-size:13px;min-height:18px"></p>
    <button type="button" class="btn" id="btn-login" onclick="window.SAIPAdminLogin && window.SAIPAdminLogin()" style="width:100%">Sign in</button>
  </div>
</div>

<div id="app" class="app">
  <header class="topbar">
    <strong>SAIP Admin</strong>
    <div style="display:flex;gap:8px;align-items:center">
      <span id="git-badge" style="font-size:12px;color:var(--muted)">—</span>
      <button type="button" class="btn btn-outline" id="btn-refresh">Refresh</button>
      <button type="button" class="btn btn-outline" id="btn-logout">Logout</button>
    </div>
  </header>
  <div class="layout">
    <aside class="side">
      <button type="button" class="tab on" data-tab="dash">Dashboard</button>
      <button type="button" class="tab" data-tab="users">Users</button>
      <button type="button" class="tab" data-tab="invoices">Invoices</button>
      <button type="button" class="tab" data-tab="tickets">Tickets</button>
      <button type="button" class="tab" data-tab="clients">Clients</button>
      <button type="button" class="tab" data-tab="devices">Devices</button>
      <button type="button" class="tab" data-tab="portals">Portals</button>
      <button type="button" class="tab" data-tab="branches">Branches</button>
      <button type="button" class="tab" data-tab="system">System</button>
    </aside>
    <main class="main">
      <h2 id="page-title">Dashboard</h2>
      <p id="page-sub" style="color:var(--muted);margin-top:0">Users & workspaces</p>
      <section id="panel-dash" class="panel"></section>
      <section id="panel-users" class="panel hidden"></section>
      <section id="panel-invoices" class="panel hidden"></section>
      <section id="panel-tickets" class="panel hidden"></section>
      <section id="panel-clients" class="panel hidden"></section>
      <section id="panel-devices" class="panel hidden"></section>
      <section id="panel-portals" class="panel hidden"></section>
      <section id="panel-branches" class="panel hidden"></section>
      <section id="panel-system" class="panel hidden"></section>
    </main>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/admin-app.js"></script>
</body>
</html>
