<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Admin · SA Invoice Pro Sync</title>
<style>
:root {
  --bg: #0b1220;
  --bg-elevated: #111827;
  --surface: #151c2c;
  --surface-2: #1a2336;
  --border: #243044;
  --border-strong: #334155;
  --text: #e8eef7;
  --text-secondary: #94a3b8;
  --muted: #64748b;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-soft: rgba(59, 130, 246, 0.12);
  --success: #10b981;
  --success-soft: rgba(16, 185, 129, 0.12);
  --danger: #ef4444;
  --danger-soft: rgba(239, 68, 68, 0.12);
  --radius: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.25);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
code {
  font-family: var(--mono);
  font-size: 0.85em;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  padding: 2px 6px;
  border-radius: 6px;
  color: #93c5fd;
}
.login-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  background: radial-gradient(ellipse 70% 50% at 50% -20%, rgba(59,130,246,.15), transparent 55%), var(--bg);
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 32px 28px;
  box-shadow: var(--shadow);
}
.login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.login-logo .mark {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  display: grid; place-items: center;
  font-weight: 700; font-size: 14px; color: #fff;
}
.login-logo .meta strong { display: block; font-size: 15px; }
.login-logo .meta span { font-size: 12px; color: var(--text-secondary); }
.login-card h1 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; }
.login-card .lede { margin: 0 0 22px; color: var(--text-secondary); font-size: 0.9rem; }
.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 6px; letter-spacing: 0.02em; text-transform: uppercase;
}
.field input {
  width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--text); font: inherit; font-size: 0.95rem;
}
.field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.login-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.err { color: #fca5a5; font-size: 0.85rem; min-height: 1.25em; margin: 10px 0 0; }
.hint { color: var(--muted); font-size: 0.8rem; margin: 6px 0 0; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 14px; border-radius: 8px; border: 1px solid transparent;
  font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer;
}
.btn:disabled { opacity: 0.55; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-secondary { background: var(--surface-2); border-color: var(--border); color: var(--text); }
.btn-sm { padding: 6px 10px; font-size: 0.8rem; }
.btn-outline { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
.btn-ok { background: var(--success-soft); border: 1px solid rgba(16,185,129,.35); color: #6ee7b7; padding: 10px 14px; border-radius: 8px; font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
.btn-danger { background: var(--danger-soft); border: 1px solid rgba(239,68,68,.35); color: #fca5a5; padding: 10px 14px; border-radius: 8px; font: inherit; font-size: 0.875rem; font-weight: 600; cursor: pointer; }
button.btn { margin: 0; }
.app-shell { min-height: 100vh; display: grid; grid-template-columns: 240px 1fr; }
@media (max-width: 860px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: sticky; top: 0; z-index: 20; border-right: 0; border-bottom: 1px solid var(--border); }
  .nav-tabs { flex-direction: row; overflow-x: auto; }
}
.sidebar {
  background: var(--bg-elevated); border-right: 1px solid var(--border);
  padding: 20px 14px; display: flex; flex-direction: column; gap: 20px;
}
.side-brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.side-brand .mark {
  width: 34px; height: 34px; border-radius: 8px;
  background: linear-gradient(145deg, #3b82f6, #1d4ed8);
  display: grid; place-items: center; font-weight: 700; font-size: 12px; color: #fff;
}
.side-brand strong { display: block; font-size: 13px; }
.side-brand span { font-size: 11px; color: var(--muted); }
.nav-tabs { display: flex; flex-direction: column; gap: 4px; }
.tab {
  appearance: none; background: transparent; border: 0; color: var(--text-secondary);
  text-align: left; padding: 10px 12px; border-radius: 8px;
  font: inherit; font-size: 0.875rem; font-weight: 500; cursor: pointer;
}
.tab:hover { background: var(--surface-2); color: var(--text); }
.tab.on { background: var(--primary-soft); color: #93c5fd; font-weight: 600; }
.side-footer { margin-top: auto; padding: 8px; border-top: 1px solid var(--border); padding-top: 14px; }
.side-footer .who { font-size: 12px; color: var(--text-secondary); margin-bottom: 10px; word-break: break-all; }
.main { padding: 24px 28px 48px; max-width: 1200px; }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.page-head h1 { margin: 0; font-size: 1.4rem; font-weight: 650; letter-spacing: -0.02em; }
.page-head .sub { margin: 4px 0 0; color: var(--text-secondary); font-size: 0.88rem; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 14px;
}
.card h3 { margin: 0 0 14px; font-size: 0.95rem; font-weight: 600; }
.card h4 { margin: 16px 0 10px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
.hidden { display: none !important; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 8px; }
.stat { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.stat .l { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.stat .v { margin-top: 6px; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 11px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
tr:hover td { background: rgba(255,255,255,.015); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); font-size: 11px; font-weight: 600; color: var(--text-secondary); }
.pill.ok { background: var(--success-soft); border-color: rgba(16,185,129,.3); color: #6ee7b7; }
input, textarea, select {
  width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg-elevated); color: var(--text); font: inherit; font-size: 0.9rem; margin: 4px 0 10px;
}
input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
label.sub, .sub { color: var(--text-secondary); font-size: 0.85rem; }
#toast {
  position: fixed; bottom: 20px; right: 20px; background: var(--surface-2); border: 1px solid var(--border);
  color: var(--text); padding: 12px 16px; border-radius: 10px; display: none; z-index: 100;
  max-width: 340px; box-shadow: var(--shadow); font-size: 0.875rem;
}
</style>
</head>
<body>

<div id="login" class="login-shell">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">SA</div>
      <div class="meta">
        <strong>SA Invoice Pro</strong>
        <span>Cloud sync · Admin console</span>
      </div>
    </div>
    <h1>Sign in</h1>
    <p class="lede">Manage users, WhatsApp intake, tickets, and live configuration.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" value="admin@sainvoice.pro" autocomplete="username"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Admin password" autocomplete="current-password"/>
    </div>
    <div class="login-actions">
      <button type="button" class="btn btn-primary" id="btn-login">Sign in</button>
      <button type="button" class="btn btn-secondary" id="btn-fill">Use default</button>
      <button type="button" class="btn btn-secondary" id="btn-wake">Wake server</button>
    </div>
    <p id="login-err" class="err"></p>
    <p id="login-hint" class="hint"></p>
  </div>
</div>

<div id="app" class="app-shell hidden">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="mark">SA</div>
      <div>
        <strong>Admin Console</strong>
        <span>Sync server v5.8</span>
      </div>
    </div>
    <nav class="nav-tabs tabs">
      <button type="button" class="tab on" data-tab="dash">Dashboard</button>
      <button type="button" class="tab" data-tab="wa">WA Clients</button>
      <button type="button" class="tab" data-tab="tickets">Tickets</button>
      <button type="button" class="tab" data-tab="invoices">Invoices</button>
      <button type="button" class="tab" data-tab="outbox">Outbox</button>
      <button type="button" class="tab" data-tab="users">Users</button>
      <button type="button" class="tab" data-tab="secrets">Configuration</button>
      <button type="button" class="tab" data-tab="tools">Tools</button>
    </nav>
    <div class="side-footer">
      <div class="who" id="who"></div>
      <button type="button" class="btn btn-secondary btn-sm" id="btn-logout" style="width:100%">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="page-head">
      <div>
        <h1>Control centre</h1>
        <p class="sub">Users · intake · status · configuration</p>
      </div>
      <div class="row">
        <a class="btn btn-secondary btn-sm" href="/health" target="_blank" rel="noopener">Health</a>
        <a class="btn btn-secondary btn-sm" href="/" target="_blank" rel="noopener">API root</a>
      </div>
    </div>
    <div id="panel-dash" class="card"></div>
    <div id="panel-wa" class="card hidden"></div>
    <div id="panel-tickets" class="card hidden"></div>
    <div id="panel-invoices" class="card hidden"></div>
    <div id="panel-outbox" class="card hidden"></div>
    <div id="panel-users" class="card hidden"></div>
    <div id="panel-secrets" class="card hidden"></div>
    <div id="panel-tools" class="card hidden"></div>
  </main>
</div>

<div id="toast"></div>
